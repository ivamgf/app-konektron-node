<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KoneKtron — engenharia de software e análise de dados." />
    <meta name="theme-color" content="#019bcd" />
    <link rel="icon" type="image/svg+xml" href="/brand/konektron-mark.svg" />
    <title>KoneKtron</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      VLibras (Governo Federal, gov.br/vlibras): tradutor de português para Libras.
      Fica fora do #root para o React não mexer no widget; some com a interface em outro idioma (main.scss).
    -->
    <div vw class="enabled notranslate" translate="no">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script
      defer
      src="https://vlibras.gov.br/app/vlibras-plugin.js"
      onload="new window.VLibras.Widget('https://vlibras.gov.br/app')"
      onerror="console.warn('VLibras indisponível (o plugin não carregou).')"
    ></script>
    <!-- Configuração de execução (URL da API), gerada quando o container sobe -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
